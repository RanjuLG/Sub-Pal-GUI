<div class="register-container">
  <div class="card">
    <div class="card-header">
      <h4 class="mb-0">Register for SubPal</h4>
    </div>
    <div class="card-body">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" formControlName="name" placeholder="Your name"
                 [class.is-invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
          <div class="invalid-feedback" *ngIf="registerForm.get('name')?.hasError('required') && registerForm.get('name')?.touched">
            Name is required
          </div>
          <div class="invalid-feedback" *ngIf="registerForm.get('name')?.hasError('minlength') && registerForm.get('name')?.touched">
            Name must be at least 2 characters
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" formControlName="email" placeholder="email@example.com"
                 [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <div class="invalid-feedback" *ngIf="registerForm.get('email')?.hasError('required') && registerForm.get('email')?.touched">
            Email is required
          </div>
          <div class="invalid-feedback" *ngIf="registerForm.get('email')?.hasError('email') && registerForm.get('email')?.touched">
            Please enter a valid email
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" formControlName="password" placeholder="Password"
                 [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <div class="invalid-feedback" *ngIf="registerForm.get('password')?.hasError('required') && registerForm.get('password')?.touched">
            Password is required
          </div>
          <div class="invalid-feedback" *ngIf="registerForm.get('password')?.hasError('minlength') && registerForm.get('password')?.touched">
            Password must be at least 6 characters
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success" role="alert">
          {{ successMessage }}
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="!registerForm.valid">
          Register
        </button>

        <div class="text-center mt-3">
          Already have an account? <a routerLink="/login">Login here</a>
        </div>
      </form>
    </div>
  </div>
</div>
