<h2 mat-dialog-title>{{ isEdit ? 'Edit' : 'Add' }} Subscription</h2>

<mat-dialog-content>
  <form [formGroup]="subscriptionForm">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Netflix, Spotify, etc.">
      <mat-error *ngIf="subscriptionForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" placeholder="9.99">
      <mat-error *ngIf="subscriptionForm.get('price')?.hasError('required')">
        Price is required
      </mat-error>
      <mat-error *ngIf="subscriptionForm.get('price')?.hasError('min')">
        Price must be positive
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Billing Cycle</mat-label>
      <mat-select formControlName="billingCycle">
        <mat-option *ngFor="let cycle of billingCycles" [value]="cycle">
          {{ cycle }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="subscriptionForm.get('billingCycle')?.hasError('required')">
        Billing cycle is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Category</mat-label>
      <input matInput formControlName="category" placeholder="Entertainment, Utilities, etc.">
      <mat-error *ngIf="subscriptionForm.get('category')?.hasError('required')">
        Category is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Renewal Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="nextRenewalDate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="subscriptionForm.get('nextRenewalDate')?.hasError('required')">
        Renewal date is required
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!subscriptionForm.valid">
    {{ isEdit ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
