<form [formGroup]="subscriptionForm">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" formControlName="name" placeholder="Netflix, Spotify, etc."
           [class.is-invalid]="subscriptionForm.get('name')?.invalid && subscriptionForm.get('name')?.touched">
    <div class="invalid-feedback" *ngIf="subscriptionForm.get('name')?.hasError('required') && subscriptionForm.get('name')?.touched">
      Name is required
    </div>
  </div>

  <div class="mb-3">
    <label for="price" class="form-label">Price</label>
    <input type="number" class="form-control" id="price" formControlName="price" placeholder="9.99"
           [class.is-invalid]="subscriptionForm.get('price')?.invalid && subscriptionForm.get('price')?.touched">
    <div class="invalid-feedback" *ngIf="subscriptionForm.get('price')?.hasError('required') && subscriptionForm.get('price')?.touched">
      Price is required
    </div>
    <div class="invalid-feedback" *ngIf="subscriptionForm.get('price')?.hasError('min') && subscriptionForm.get('price')?.touched">
      Price must be positive
    </div>
  </div>

  <div class="mb-3">
    <label for="billingCycle" class="form-label">Billing Cycle</label>
    <select class="form-select" id="billingCycle" formControlName="billingCycle"
            [class.is-invalid]="subscriptionForm.get('billingCycle')?.invalid && subscriptionForm.get('billingCycle')?.touched">
      <option *ngFor="let cycle of billingCycles" [value]="cycle">{{ cycle }}</option>
    </select>
    <div class="invalid-feedback" *ngIf="subscriptionForm.get('billingCycle')?.hasError('required') && subscriptionForm.get('billingCycle')?.touched">
      Billing cycle is required
    </div>
  </div>

  <div class="mb-3">
    <label for="category" class="form-label">Category</label>
    <input 
      type="text" 
      class="form-control" 
      id="category" 
      formControlName="category" 
      list="categoryList"
      placeholder="Select existing or type new category"
      [class.is-invalid]="subscriptionForm.get('category')?.invalid && subscriptionForm.get('category')?.touched">
    <datalist id="categoryList">
      <option *ngFor="let cat of categories" [value]="cat">
    </datalist>
    <small class="form-text text-muted">Select from existing categories or type a new one</small>
    <div class="invalid-feedback" *ngIf="subscriptionForm.get('category')?.hasError('required') && subscriptionForm.get('category')?.touched">
      Category is required
    </div>
  </div>

  <div class="mb-3">
    <label for="nextRenewalDate" class="form-label">Renewal Date</label>
    <input type="date" class="form-control" id="nextRenewalDate" formControlName="nextRenewalDate"
           [class.is-invalid]="subscriptionForm.get('nextRenewalDate')?.invalid && subscriptionForm.get('nextRenewalDate')?.touched">
    <div class="invalid-feedback" *ngIf="subscriptionForm.get('nextRenewalDate')?.hasError('required') && subscriptionForm.get('nextRenewalDate')?.touched">
      Renewal date is required
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="!subscriptionForm.valid">
      {{ isEdit ? 'Update' : 'Add' }}
    </button>
  </div>
</form>
